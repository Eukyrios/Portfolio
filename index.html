<!DOCTYPE html>
<html lang="en" data-view="pond">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Koi Pond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="pond" aria-label="A pond of koi drawn in text characters, with projects floating on the water. Use the numbered project buttons to open them."></canvas>
<div class="ui season" id="season" role="slider" tabindex="0" aria-label="Season" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.5">
  <canvas class="dial3d" width="100" height="100" aria-hidden="true"></canvas>
  <span id="season-name">autumn</span>
</div>
<div class="ui sky" id="sky" role="slider" tabindex="0" aria-label="Time of day" aria-valuemin="0" aria-valuemax="24" aria-valuenow="12">
  <canvas class="dial3d" width="100" height="100" aria-hidden="true"></canvas>
  <span id="sky-time">12:00</span>
</div>
<nav class="ui tr kbd-nav" aria-label="Projects"><span class="dim">projects</span><span id="nav"></span></nav>
<div class="ui br mm"><canvas id="minimap" aria-label="Map of the whole pond. Click it to move the view there."></canvas></div>
<div class="ui bl">
  <div class="move">
    <div id="keys" class="keys" aria-hidden="true"><span></span><kbd data-k="w">W</kbd><span></span><kbd data-k="a">A</kbd><kbd data-k="s">S</kbd><kbd data-k="d">D</kbd></div>
    <div id="stick" class="stick" aria-hidden="true"><div class="knob"></div></div>
    <span class="dim keys-hint">move<br>around</span>
  </div>
  <span hidden><b id="bird-count">0</b><b id="count">0</b><b id="fed">0</b><b id="lost">0</b></span>
</div>
<div id="tag" class="tag" hidden></div>
<aside id="panel" class="panel" role="dialog" aria-label="Project" hidden><pre id="panel-text"></pre></aside>

<script src="js/boot.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
