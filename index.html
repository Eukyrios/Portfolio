<!DOCTYPE html>
<html lang="en" data-view="pond">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Koi Pond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* One screen: a full-bleed character grid with four quiet corners of UI. */
  :root {
    --page: #071417;
    --ink: #9fc7c9;
    --ink-dim: #4f7a7e;
    --accent: #ff6a2b;
    --line: #17363a;
    --ink-hi: #e6f1f1;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  :root[data-view="garden"] {
    --page: #e7ddcc; --ink: #4a4036; --ink-dim: #85776a; --accent: #b4441a; --line: #cdbfa8; --ink-hi: #2b241d;
    color-scheme: light;
  }
  [data-view="garden"] .pond-only { display: none !important; }
  :root:not([data-view="garden"]) .garden-only { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--page); transition: background 0.3s; }
  .views { display: flex; gap: 4px; margin-left: 8px; pointer-events: auto; }
  .views button { padding: 2px 8px; }
  .views button[aria-current="true"] { color: var(--page); background: var(--ink); border-color: var(--ink); }
  body { font-family: var(--mono); color: var(--ink); font-size: 12px; letter-spacing: 0.02em; }
  #pond { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  .ui { position: fixed; display: flex; gap: 10px; align-items: center; padding: 16px 20px; pointer-events: none; user-select: none; }
  .tl { top: 0; left: 0; }
  /* The name sits on a solid chip so the characters under it don't bleed through. */
  .brand {
    display: flex; gap: 8px; align-items: baseline; padding: 5px 10px; font-size: 13px;
    background: color-mix(in srgb, var(--page) 94%, transparent); backdrop-filter: blur(4px);
    border: 1px solid var(--line); box-shadow: 0 0 0 4px color-mix(in srgb, var(--page) 55%, transparent);
  }
  .tr { top: 0; right: 0; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .bl { bottom: 0; left: 0; color: var(--ink-dim); }
  .br { bottom: 0; right: 0; pointer-events: auto; }
  .mark { color: var(--accent); font-weight: 600; }
  .tr b { color: var(--ink); font-weight: 400; }
  button, select {
    font: inherit; color: var(--ink); background: color-mix(in srgb, var(--page) 70%, transparent);
    border: 1px solid var(--line); padding: 4px 10px; cursor: pointer; border-radius: 0;
  }
  select { padding: 4px 6px; }
  option { background: var(--page); }
  button:hover, select:hover { border-color: var(--ink-dim); }
  button[aria-pressed="true"] { color: var(--page); background: var(--ink); border-color: var(--ink); }
  button:focus-visible, select:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .tag {
    position: fixed; left: 0; top: 0; pointer-events: none; padding: 3px 8px; white-space: nowrap;
    background: color-mix(in srgb, var(--page) 82%, transparent); border: 1px solid var(--line); color: var(--ink);
  }
  .tag span { color: var(--ink-dim); }
  .dim { color: var(--ink-dim); }
  .tl b { color: var(--ink-hi); font-weight: 600; }
  .tr { pointer-events: auto; }
  .kbd-nav:not(:focus-within) { clip-path: inset(50%); width: 1px; height: 1px; padding: 0; overflow: hidden; white-space: nowrap; }
  #nav { display: flex; gap: 4px; }
  #nav button { padding: 2px 6px; font-variant-numeric: tabular-nums; }
  #nav button[aria-current="true"] { color: var(--page); background: var(--accent); border-color: var(--accent); }
  .bl { flex-direction: column; align-items: flex-start; gap: 8px; font-variant-numeric: tabular-nums; }
  #minimap { display: block; cursor: pointer; pointer-events: auto; }
  .move { display: flex; align-items: flex-end; gap: 10px; }
  .keys { display: grid; grid-template-columns: repeat(3, 28px); grid-auto-rows: 28px; gap: 4px; }
  .keys kbd {
    display: grid; place-items: center; font: inherit; font-size: 11px; font-weight: 600; color: var(--ink);
    border: 1px solid var(--line); border-bottom-width: 3px; background: color-mix(in srgb, var(--page) 70%, transparent);
    cursor: pointer; user-select: none; pointer-events: auto; touch-action: none;
    transition: background 0.08s, color 0.08s, transform 0.08s, border-color 0.08s, box-shadow 0.15s;
  }
  .keys kbd.on {
    background: var(--accent); color: var(--page); border-color: var(--accent); border-bottom-width: 1px;
    transform: translateY(2px); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .stick {
    display: none; width: 104px; height: 104px; border-radius: 50%; place-items: center; pointer-events: auto; touch-action: none;
    border: 1px solid var(--line);
    background: radial-gradient(circle, color-mix(in srgb, var(--ink) 12%, transparent) 0 28%, color-mix(in srgb, var(--page) 72%, transparent) 29%);
  }
  .stick .knob { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); opacity: 0.85; pointer-events: none; }
  .stick:not(.on) .knob { transition: transform 0.18s ease-out; }
  .stick.on { border-color: var(--accent); }
  .stick.on .knob { background: var(--accent); opacity: 1; box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 60%, transparent); }
  @media (hover: none) and (pointer: coarse) { .keys, .keys-hint { display: none; } .stick { display: grid; } }
  .bl b { color: var(--ink); font-weight: 400; }
  /* The project panel is drawn in characters, like the pond. */
  .panel {
    position: fixed; top: 56px; right: 16px; max-height: calc(100% - 120px); overflow: auto; margin: 0;
    background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(4px);
  }
  .panel[hidden] { display: none; }
  .panel pre { margin: 0; padding: 0; font: 600 13px/1.4 var(--mono); letter-spacing: 0; color: var(--ink); white-space: pre; }
  .panel .b { color: var(--ink-dim); }
  .panel .ti { color: var(--ink-hi); }
  .panel .ac { color: var(--accent); }
  .panel .dm { color: var(--ink-dim); }
  .panel .tx { font: inherit; letter-spacing: 0; color: var(--ink); background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-decoration: none; white-space: pre; }
  .panel .tx:hover, .panel .tx:focus-visible { color: var(--page); background: var(--accent); outline: none; }
  a.btn { font: inherit; color: var(--page); background: var(--ink); border: 1px solid var(--ink); padding: 4px 10px; text-decoration: none; }
  a.btn:hover { background: var(--ink-hi); }
  a.btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  a.btn[hidden] { display: none; }
  @media (max-width: 640px) {
    .bl .hint, .bl .stats, #minimap { display: none; } .ui { padding: 12px 14px; } #kind { max-width: 110px; }
    .br { flex-direction: column; align-items: flex-end; gap: 6px; }
    .panel { top: auto; bottom: 56px; left: 50%; right: auto; transform: translateX(-50%); max-height: 60%; }
    .tl .dim { display: none; }
  }
  .nogl { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ink-dim); }
</style>
</head>
<body>
<canvas id="pond" aria-label="A pond of koi drawn in text characters, with projects floating on the water. Use the numbered project buttons to open them."></canvas>

<script>
  // If something goes wrong, say so on the page instead of leaving it blank.
  (function () {
    var shown = false;
    window.pondFail = function (msg) {
      if (shown) return; shown = true;
      var d = document.createElement("div"); d.className = "nogl"; d.style.zIndex = 9; d.style.padding = "24px"; d.style.textAlign = "center";
      d.textContent = msg; document.body.appendChild(d);
    };
    window.addEventListener("error", function (e) { window.pondFail("The pond hit an error: " + (e.message || e.type) + ". Reload to try again."); });
    window.addEventListener("unhandledrejection", function (e) { window.pondFail("The pond hit an error: " + (e.reason && e.reason.message || e.reason) + ". Reload to try again."); });
    setTimeout(function () {
      if (!window.pondStarted) window.pondFail("The pond could not load three.js from cdn.jsdelivr.net. An ad blocker, VPN or network filter may be blocking it; reload to try again.");
    }, 12000);
  })();
</script>

/* ------------------------------------------------------------------ *

 *     Red = light, green = colour class, blue = depth, alpha = hit.
 *  3. A cell pass turns each cell into a glyph + colour, adding water,
 *     ripple wave packets, refraction and shadows.
 *  4. A screen pass stamps the glyph from a font atlas into every cell.
 * ------------------------------------------------------------------ */

const PATTERN_NAMES = { 15: "platinum", 3: "ogon", 0: "kohaku", 6: "kigoi", 14: "kujaku" };

/* ---------------- shared GLSL ---------------- */
const NOISE = /* glsl */`

float noise3(vec3 x){

  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x), mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x), mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y), f.z);
}
float fbm3(vec3 p){ return 0.55*noise3(p) + 0.3*noise3(p*2.07+11.0) + 0.15*noise3(p*4.13+23.0); }

const LIGHT = new THREE.Vector3(-0.35, 0.4, 0.85).normalize();

const FISH_VERT = /* glsl */`
#define NJ ${NJ}
attribute float aPart;  // 0 body 1 pectoral 2 pelvic 3 dorsal 4 tail 5 eye
attribute float aFlap;  // 0 at the fin root, 1 at its edge
attribute float aSide;
uniform vec3 uSpine[NJ];   // the body's backbone in world px, snout first
uniform float uSeg, uL, uRoll;
uniform float uPhase, uAmp, uFlap, uTurn, uFold, uLong, uFlare;
varying vec3 vN; varying vec3 vLocal; varying float vPart; varying float vFlapW; varying float vZ;

    p.x -= aFlap * uFold * 0.07;

    p.y -= uTurn * 0.05 * aFlap * aFlap;

    vec3 P2 = i + 2 < NJ ? uSpine[min(i+2, NJ-1)] : 2.0*P1 - P0;

const FISH_FRAG = /* glsl */`
uniform vec3 uLight; uniform float uType; uniform float uSeed; uniform float uMaxDepth;
varying vec3 vN; varying vec3 vLocal; varying float vPart; varying float vFlapW; varying float vZ;

float net(vec3 L){  // scale reticulation, 1 on scale edges

  vec2 f = abs(fract(q) - 0.5);

}
float bodyClass(vec3 L, out float tex){

  float n = fbm3(q), n2 = fbm3(q*2.3 + 31.0);

  if (t == 1) { if (n2 > 0.68 && top > 0.4) return 3.0; return (n > 0.52 && top > 0.2) ? 2.0 : 1.0; }
  if (t == 2) { if (n > 0.56 && top > 0.2) return 2.0; if (n2 > 0.56) return 1.0; return 3.0; }
  if (t == 3) { tex = 1.0 - 0.15*nt; return 4.0; }
  if (t == 4) { vec2 d = vec2(L.x - 0.36, L.y*1.2); return (length(d) < 0.056 && top > 0.3) ? 2.0 : 1.0; }
  if (t == 5) { tex = 1.0 - 0.2*nt; if (L.x > 0.34) return 1.0; return top > 0.45 ? 11.0 : 2.0; }
  if (t == 6) return 12.0;
  if (t == 7) return (n > 0.58 && top > 0.3) ? 1.0 : 13.0;
  if (t == 8) return n > 0.47 ? 1.0 : 3.0;
  if (t == 9) return n > 0.5 ? 2.0 : 3.0;
  if (t == 10) return (n2 > 0.7 && top > 0.4) ? 3.0 : 1.0;
  if (t == 11) { tex = 1.0 - 0.25*nt; return 14.0; }
  if (t == 12) { tex = 1.0 - 0.25*nt; return 15.0; }
  if (t == 13) { if (n > 0.56 && top > 0.2) return 2.0; return nt > 0.5 ? 3.0 : 15.0; }
  if (t == 14) { if (n > 0.5 && top > 0.2) return 13.0; return nt > 0.5 ? 15.0 : 1.0; }
  if (t == 15) { tex = 1.0 - 0.12*nt; return 17.0; }
  if (t == 16) return (n > 0.62 && top > 0.3) ? 1.0 : 2.0;
  if (t == 17) { if (n2 > 0.72) return 3.0; if (n > 0.55) return 2.0; return n2 > 0.45 ? 11.0 : 1.0; }

  return 1.0;
}
float finClass(int t, float part, float w){
  if (t == 3) return 4.0; if (t == 6) return 12.0; if (t == 7 || t == 18) return 13.0;
  if (t == 11) return 14.0; if (t == 12) return 15.0; if (t == 15) return 17.0;
  if (t == 16) return w < 0.55 ? 2.0 : 5.0;
  if (t == 17) return w > 0.6 ? 2.0 : 5.0;

void main(){
  vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;

  float spec = pow(max(dot(n, normalize(uLight + vec3(0.0,0.0,1.0))), 0.0), 28.0);
  int t = int(uType + 0.5);
  float tex = 1.0, cls;
  if (vPart < 0.5) cls = bodyClass(vLocal, tex);
  else if (vPart > 4.5) cls = 3.0;
  else cls = finClass(t, vPart, vFlapW);
  bool metal = cls == 4.0 || cls == 17.0;
  float light = (0.3 + 0.7*lam) * tex + spec*(metal ? 0.85 : 0.35);
  if (vPart > 0.5 && vPart < 4.5) light *= 0.55;
  gl_FragColor = vec4(clamp(light, 0.0, 1.0), cls/31.0, clamp(-vZ/uMaxDepth, 0.0, 1.0), 1.0);
}`;

/* ---------------- shade pass: surface things ---------------- */
const SOLID_VERT = /* glsl */`
varying vec3 vN; varying vec3 vLocal;
void main(){
  vLocal = position;
  vN = normalize(mat3(modelMatrix) * normal);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);

const SOLID_FRAG = /* glsl */`
uniform vec3 uLight; uniform float uClass; uniform float uPad; uniform float uEmit; uniform float uTag;
varying vec3 vN; varying vec3 vLocal;
void main(){

/* ---------------- cell pass ---------------- */
const QUAD_VERT = /* glsl */`void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const CELL_FRAG = /* glsl */`
uniform sampler2D uShade; uniform vec2 uGrid; uniform vec2 uCellCss; uniform float uTime;
uniform vec4 uRip[${NR}]; uniform vec3 uPal[32]; uniform float uMono; uniform float uIntro;
uniform vec2 uShadow; uniform vec2 uDrift;
uniform sampler2D uText; uniform vec4 uGlow[8]; uniform vec2 uScroll; uniform float uHoverTag;
uniform vec4 uFlames[8];   // screen x, y, radius, brightness of each candle flame
uniform sampler2D uHeightMap; uniform vec4 uGarden; uniform vec2 uHalf; uniform float uSpacing;
uniform float uZoom; uniform vec2 uCam; uniform vec2 uAxis;   // screen px per world px, camera centre (world), its screen point
uniform vec2 uShadowRock; uniform vec2 uShadowBird;
${NOISE}
float hash2(vec2 c){ return fract(sin(dot(c, vec2(12.9898, 78.233))) * 43758.5453); }
float shoreY(float wx){ return uGarden.x + 40.0*sin(wx*0.003) + 22.0*sin(wx*0.011 + 1.0); }
// The height map runs from the garden's north edge down to 80 px south of the shore line.
vec2 hUV(vec2 w){ return vec2((w.x - uGarden.y) / uGarden.z, (uGarden.x - 80.0 + uGarden.w - w.y) / uGarden.w); }
float hAt(vec2 w){ return texture2D(uHeightMap, hUV(w)).r; }
// The raking direction stored with the height: 0 = none, else 1..255 over 0..pi (screen orientation).
float flowAt(vec2 w){ ivec2 n = textureSize(uHeightMap, 0); return texelFetch(uHeightMap, ivec2(clamp(hUV(w), 0.0, 0.999) * vec2(n)), 0).g * 255.0; }

float vertexAt(float a, float b, float c, out float k){ k = a - 2.0*b + c; return abs(k) > 0.003 ? (a - c) / (2.0*k) : 9.0; }

vec4 shadeAt(vec2 c, bool dryOnly, out float cover, out float bird, out float birdR, out float birdC){

  for (int k = 0; k < 4; k++) {

// A starling's colour from its code (see BIRD_FRAG) and light.
vec3 birdColor(float c, float l){

  if (c < 0.25) return vec3(0.05);                                              // eye
  if (c < 0.31) return vec3(0.95, 0.89, 0.72) * (0.8 + 0.25*l);                  // pale spots
  if (c < 0.34) return vec3(0.62, 0.5, 0.33) * (0.7 + 0.4*l);                     // buff feather edges

  float wy = uCam.y - (pos.y - uAxis.y) / uZoom;

      if (gl > 0.86 && hs > 0.7) { glyph = ${G_TICK}.0; col = vec3(0.6, 0.9, 0.92) * (gl - 0.6) * 2.5; }

        bool hot = abs(tagN - uHoverTag) < 0.01;
        glyph = (sideN > 0.5 && vert > 0.5) || (sideN < 0.5 && vert < 0.5) ? 6.0 : (sideN > 0.5 ? ${G_BAR}.0 : ${G_DASH}.0);
        col = hot ? vec3(1.0, 0.47, 0.2) * (0.8 + 0.2*sin(uTime*6.0 + (cTL.x + cTL.y)*0.6)) : vec3(0.55, 0.78, 0.8) * 0.7;
        shadow = 0.0;
      }
    }
  } else {
    /* ---------- the garden ---------- */
    float cover, bird, bR, bC; vec4 s = shadeAt(cBL, true, cover, bird, bR, bC);
    vec3 lo = vec3(0.50, 0.43, 0.34), mid = vec3(0.70, 0.64, 0.55);
    if (bird > 0.0 && cover < 0.75) {
      glyph = clamp(floor(bird * ${RAMP_TOP}.0 * (0.6 + 0.4 * bR) + 0.5), 2.0, ${RAMP_TOP}.0); overBird = true; col = birdColor(bC, bR);
    } else if (cover > 0.0) {
      float cls = floor(s.g*31.0 + 0.5);
      float light = s.r * mix(0.6, 1.0, cover);
      bool stone = cls == 24.0 || cls == 29.0 || cls == 31.0;
      float dens = stone ? 0.68 + (1.0 - light)*0.32 : 1.0 - light*0.55;
      glyph = clamp(floor(dens*10.0 + 0.5), 2.0, 10.0);        // darker = denser on light sand
      col = uPal[int(cls)] * (0.6 + 0.5*light);
      if (cls == 30.0) { glyph = 10.0; col = uPal[30]; }
    } else {
      if (side > 24.0) {
        // Sand. Each furrow and crest is found inside the cell (a parabola through
        // three height samples across it) and drawn as a thin line at that spot,
        // so ridges stay continuous and smooth; the slopes between get grain.
        vec2 W0 = vec2(wx, wy);
        float n2 = hash2(wc * 1.7 + 3.1);
        // Zoomed out, the ridges get finer than a row of characters and would turn
        // to moire. Then the sand shows the flow of the raking as a light hatch.
        float rows = uSpacing * uZoom / uCellCss.y;
        if (rows < 1.25 + 0.45 * hash2(wc + 5.0)) {
          float oc = flowAt(W0);
          if (oc > 0.5) {
            float q = floor(((oc - 1.0) / 254.0 * 3.14159265) / 0.785398 + 0.5);
            float lg = (q == 0.0 || q == 4.0) ? ${L_HM}.0 : (q == 1.0 ? ${L_DD}.0 : (q == 2.0 ? ${L_VM}.0 : ${L_DU}.0));
            if (n2 < 0.42) { glyph = lg; col = mix(mid, lo, 0.3 + 0.3 * hash2(wc + 2.0)); }
            else if (n2 > 0.93) { glyph = ${ATLAS.length + 46 - 32}.0; col = mid; }
          }
        } else {
        float cw = uCellCss.x / uZoom, chh = uCellCss.y / uZoom;   // a cell, in world px
        float hx = (hAt(W0 + vec2(cw*0.5, 0.0)) - hAt(W0 - vec2(cw*0.5, 0.0))) / cw;
        float hy = (hAt(W0 - vec2(0.0, chh*0.5)) - hAt(W0 + vec2(0.0, chh*0.5))) / chh;     // screen y, down
        vec2 g = vec2(hx, hy) * uSpacing / 3.14159;
        float lit = -dot(g, normalize(vec2(-0.6, -0.8))), dark = -lit;
        float h0 = hAt(W0), k, t, lineG = 0.0;
        if (abs(g.y) > abs(g.x) * 1.6) {                     // ridges run across: sample down the cell
          t = vertexAt(hAt(W0 + vec2(0.0, chh/3.0)), h0, hAt(W0 - vec2(0.0, chh/3.0)), k);
          if (abs(t) <= 1.5) lineG = t < -0.5 ? ${L_HT}.0 : (t > 0.5 ? ${L_HB}.0 : ${L_HM}.0);
        } else if (abs(g.x) > abs(g.y) * 1.6) {              // ridges run up and down: sample across
          t = vertexAt(hAt(W0 - vec2(cw/3.0, 0.0)), h0, hAt(W0 + vec2(cw/3.0, 0.0)), k);
          if (abs(t) <= 1.5) lineG = t < -0.5 ? ${L_VL}.0 : (t > 0.5 ? ${L_VR}.0 : ${L_VM}.0);
        } else {                                             // diagonal ridges
          vec2 gd = normalize(g + 1e-6);
          vec2 off = vec2(gd.x * cw, -gd.y * chh) / 3.0;
          t = vertexAt(hAt(W0 - off), h0, hAt(W0 + off), k);
          if (abs(t) <= 0.9) lineG = g.x * g.y > 0.0 ? ${L_DU}.0 : ${L_DD}.0;
        }
        if (lineG > 0.0 && k > 0.0) { glyph = lineG; col = mix(mid, lo, 0.65); }                 // furrow
        else if (lineG > 0.0) { glyph = lineG; col = vec3(1.0, 0.985, 0.95); }                  // crest in the light
        else if (dark > 0.15 && n2 < 0.12 + dark*0.35) { glyph = n2 < 0.08 ? ${ATLAS.length + 58 - 32}.0 : ${ATLAS.length + 46 - 32}.0; col = mix(mid, lo, dark*0.6); }
        else if (n2 > 0.94) { glyph = ${ATLAS.length + 46 - 32}.0; col = mid; }
        }
        // Contact shading where the sand meets a stone.
        float ao = 0.0;
        for (int q = 0; q < 4; q++) {
          vec2 o = q == 0 ? vec2(1, 0) : q == 1 ? vec2(-1, 0) : q == 2 ? vec2(0, 1) : vec2(0, -1);
          vec4 sq = texture2D(uShade, (cBL + o + 0.5) / uGrid);
          float c = floor(sq.g*31.0 + 0.5);
          if (sq.a > 0.95 && (c == 24.0 || c == 29.0)) ao = 1.0;
        }
        if (ao > 0.0) { glyph = n2 > 0.5 ? ${ATLAS.length + 58 - 32}.0 : ${ATLAS.length + 59 - 32}.0; col = lo * 0.8; }
      } else {                                                // the wet, packed sand at the water's edge
        float n2 = hash2(wc * 1.7 + 3.1);
        if (n2 > 0.55) { glyph = n2 > 0.85 ? ${ATLAS.length + 44 - 32}.0 : ${ATLAS.length + 46 - 32}.0; col = mix(mid, lo, 0.5); }
      }
      float sc, sb, sr, sbc; shadeAt(cBL + uShadowRock, true, sc, sb, sr, sbc);
      shadow = sc;
      col *= 1.0 - shadow*0.3;
    }
  }
  if (uIntro < 1700.0 && glyph > 0.0) {
    float at = (cTL.x / uGrid.x) * 1000.0 + hash2(vec2(cTL.x, 3.0)) * 250.0 + hash2(cTL + 9.0) * 350.0;
    if (uIntro < at) glyph = 1.0 + floor(hash2(cTL + floor(uIntro/60.0)) * 10.0);
  }
  vec4 tx = texelFetch(uText, ivec2(cBL), 0);           // project titles written into the grid
  float tgl = floor(tx.r*255.0 + 0.5);
  if (tgl > 0.5 && !overBird) {            // birds fly over the writing
    float st = floor(tx.g*255.0 + 0.5);
    glyph = tgl; shadow = 0.0;
    col = land ? (st > 2.5 ? vec3(0.75, 0.28, 0.1) : (st > 1.5 ? vec3(0.48, 0.42, 0.35) : vec3(0.22, 0.19, 0.15)))
               : (st > 2.5 ? vec3(1.0, 0.46, 0.2) : (st > 1.5 ? vec3(0.45, 0.64, 0.66) : vec3(0.84, 0.93, 0.93)));
  }
  if (uMono > 0.5) { float l = dot(col, vec3(0.3, 0.55, 0.15)); col = vec3(min(l*1.3, 1.0)); }
  gl_FragColor = vec4(col, (glyph + (shadow >= 0.5 ? 128.0 : 0.0)) / 255.0);
}`;

/* ---------------- screen pass ---------------- */
const SCREEN_FRAG = /* glsl */`
uniform sampler2D uCells; uniform sampler2D uAtlas; uniform vec2 uCellDev; uniform vec2 uGrid;
uniform float uHeight; uniform float uGlyphs; uniform vec3 uPage; uniform vec3 uPageShadow;
uniform vec3 uSand; uniform vec3 uSandShadow; uniform vec2 uCellCss; uniform vec4 uGarden; uniform float uZoom; uniform vec2 uCam; uniform vec2 uAxis;
float shoreY(float wx){ return uGarden.x + 40.0*sin(wx*0.003) + 22.0*sin(wx*0.011 + 1.0); }
void main(){
  vec2 p = vec2(gl_FragCoord.x, uHeight - gl_FragCoord.y);
  vec2 cell = min(floor(p / uCellDev), uGrid - 1.0);
  vec4 c = texelFetch(uCells, ivec2(int(cell.x), int(uGrid.y - 1.0 - cell.y)), 0);
  float v = floor(c.a*255.0 + 0.5);
  float sh = v >= 128.0 ? 0.85 : 0.0;
  float glyph = v >= 128.0 ? v - 128.0 : v;
  vec2 cp = (cell + 0.5) * uCellCss;                    // same cell centre the cell pass used
  float wx = uCam.x + (cp.x - uAxis.x) / uZoom, wy = uCam.y - (cp.y - uAxis.y) / uZoom;
  float side = wy - shoreY(wx);
  bool land = side > -18.0;
  float shallow = smoothstep(-190.0, -18.0, side);     // sand seen through the water, fading into the deep
  vec3 deep = mix(uPage, uPageShadow, sh), bed = mix(vec3(0.40, 0.42, 0.36), vec3(0.27, 0.29, 0.25), sh);
  vec3 page = land ? mix(uSand, uSandShadow, sh) : mix(deep, bed, shallow * shallow * 0.9);
  vec2 inCell = fract(p / uCellDev);
  float ink = glyph > 0.5 ? texture2D(uAtlas, vec2((glyph + inCell.x)/uGlyphs, inCell.y)).r : 0.0;
  gl_FragColor = vec4(mix(page, c.rgb, ink), 1.0);
}`;

/* ---------------- geometry ---------------- */
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const sToX = (s) => 0.5 - 0.8 * s;
const bodyZc = (s) => 0.012 * Math.sin(Math.PI * s);

function makeBuilder() {
  const P = [], part = [], flap = [], side = [], idx = [];
  function grid(nu, nv, fn, partId, sideV = 0) {
    const start = P.length / 3;
    for (let i = 0; i <= nu; i++) for (let j = 0; j <= nv; j++) {
      const r = fn(i / nu, j / nv);
      P.push(r[0], r[1], r[2]); part.push(partId); flap.push(r[3] ?? 0); side.push(sideV);
    }
    for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
      const a = start + i * (nv + 1) + j, b = a + nv + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  function build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(P, 3));
    g.setAttribute("aPart", new THREE.Float32BufferAttribute(part, 1));
    g.setAttribute("aFlap", new THREE.Float32BufferAttribute(flap, 1));
    g.setAttribute("aSide", new THREE.Float32BufferAttribute(side, 1));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  return { grid, build };
}

function fishGeometry(o) {
  const W = o.w;
  const bw = (s) => s < 0.3 ? W * Math.pow(Math.sin(s / 0.3 * Math.PI / 2), 0.55) : W * (1 - smooth(0.3, 1.0, s) * 0.84);
  const b = makeBuilder();
  const finSegs = o.long ? 18 : 10;
  // Body: an ellipse lofted from snout to tail, seam on the belly.
  b.grid(60, 24, (s, v) => {
    const a = -Math.PI / 2 + v * Math.PI * 2, w = bw(s), sa = Math.sin(a);
    return [sToX(s), w * Math.cos(a), bodyZc(s) + w * sa * (sa < 0 ? 0.85 : 1.0)];
  }, 0);
  const ew = bw(0.0875), er = W * 0.13;
  for (const sd of [-1, 1]) b.grid(6, 8, (u, v) => {
    const la = -Math.PI / 2 + u * Math.PI, lo = v * Math.PI * 2;
    return [0.43 + er * Math.cos(la) * Math.cos(lo), sd * ew * 0.8 + er * Math.cos(la) * Math.sin(lo), ew * 0.45 + er * Math.sin(la)];
  }, 5);
  const fin = (root, d, L, C, partId, sd) => {
    const len = Math.hypot(...d), dn = d.map((x) => x / len);
    b.grid(finSegs, 6, (t, w) => {
      const chord = C * (0.55 + 0.45 * Math.sin(Math.PI * t * 0.8)) * Math.sqrt(Math.max(1 - t * t * t, 0)) + 0.004;
      return [root[0] + dn[0] * t * L - (w - 0.15) * chord, root[1] + dn[1] * t * L, root[2] + dn[2] * t * L - 0.02 * t * t, t];
    }, partId, sd);
  };
  for (const sd of [-1, 1]) {
    const w1 = bw(0.29), w2 = bw(0.625);
    fin([0.27, sd * w1 * 0.72, -w1 * 0.38], [-0.5, sd, -0.2], o.pecL, o.pecC, 1, sd);
    fin([0.0, sd * w2 * 0.6, -w2 * 0.6], [-0.6, sd, -0.3], o.pelL, o.pelL * 0.6, 2, sd);
  }
  const dFrom = o.dFrom ?? 0.3, dTo = o.dTo ?? 0.75;
  b.grid(14, 3, (t, v) => {
    const s = dFrom + (dTo - dFrom) * t, h = o.dH * Math.pow(Math.sin(Math.PI * t), 0.6) * (1 - 0.4 * t);
    return [sToX(s) - v * 0.03, 0, bodyZc(s) + bw(s) - 0.006 + v * h, v];
  }, 3);
  // Tail: a forked fan, tilted so it reads from above.
  const x0 = sToX(0.97), z0 = bodyZc(0.97);
  b.grid(finSegs, 18, (t, v) => {
    const w = v * 2 - 1, aw = Math.abs(w);
    const Lw = o.tailL * (1 - o.fork + o.fork * Math.pow(aw, 0.7));
    const hs = 0.022 + o.tailSpan * Math.pow(t, 0.85);
    return [x0 - t * Lw, w * hs * 0.85, z0 + w * hs * 0.4, t];
  }, 4);
  return b.build();
}

const GEO = {
  koi: fishGeometry({ w: 0.132, tailL: 0.22, tailSpan: 0.12, fork: 0.38, pecL: 0.17, pecC: 0.095, pelL: 0.1, dH: 0.05 }),
  butterfly: fishGeometry({ w: 0.12, tailL: 0.46, tailSpan: 0.17, fork: 0.32, pecL: 0.32, pecC: 0.12, pelL: 0.2, dH: 0.08, dTo: 0.88, long: true }),
  comet: fishGeometry({ w: 0.165, tailL: 0.5, tailSpan: 0.15, fork: 0.55, pecL: 0.15, pecC: 0.08, pelL: 0.1, dH: 0.075, long: true }),
  orfe: fishGeometry({ w: 0.088, tailL: 0.2, tailSpan: 0.1, fork: 0.6, pecL: 0.12, pecC: 0.06, pelL: 0.07, dH: 0.045 }),
};

function padGeometry() {
  const P = [], idx = [];
  const rings = 9, segs = 44, notch = 0.5;
  P.push(0, 0, 0);
  for (let i = 1; i <= rings; i++) for (let j = 0; j <= segs; j++) {
    const r = i / rings, a = notch / 2 + (j / segs) * (Math.PI * 2 - notch);
    P.push(r * Math.cos(a), r * Math.sin(a), 0.03 * r * r + 0.06 * Math.pow(r, 10) + 0.012 * Math.sin(a * 7) * Math.pow(r, 4));
  }
  for (let j = 0; j < segs; j++) idx.push(0, 1 + j, 2 + j);
  for (let i = 1; i < rings; i++) for (let j = 0; j < segs; j++) {
    const a = 1 + (i - 1) * (segs + 1) + j, b = a + segs + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(P, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

function petalGeometry(count, len, elev, twist) {
  const b = makeBuilder();
  for (let k = 0; k < count; k++) {
    const phi = (k / count) * Math.PI * 2 + twist;
    b.grid(6, 4, (t, w) => {
      const width = 0.32 * len * Math.pow(Math.sin(Math.PI * Math.min(t, 0.999)), 0.8) * (w * 2 - 1);
      const r = t * len * Math.cos(elev), z = t * len * Math.sin(elev) + 0.1 * len * t * t;
      return [r * Math.cos(phi) - width * Math.sin(phi), r * Math.sin(phi) + width * Math.cos(phi), z];
    }, 0);
  }
  return b.build();
}

const fish = [], pads = [], food = [], drops = [];

const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const halfW = () => view.WX / 2;                      // the pond is bigger than the screen; its south edge is the shore
const halfH = () => view.WY / 2;

/** World point (y up, origin at the pond's centre) to CSS px from the screen's top-left. */
/** Screen px per world px for something at height z. */
const scaleAt = (z = 0) => view.camZ / (view.camZ / view.zoom - z);
function project(x, y, z = 0) {
  const s = scaleAt(z), cx = view.cx + view.panX, cy = view.cy + view.panY;
  return [view.W / 2 + view.cx + (x - cx) * s, view.H / 2 - view.cy - (y - cy) * s];
}
const toWorld = (sx, sy) => [view.cx + view.panX + (sx - view.W / 2 - view.cx) / view.zoom, view.cy + view.panY - (sy - view.H / 2 + view.cy) / view.zoom];

function ripple(x, y, strength, big = false) {          // world coords
  const i = big ? bigIdx : BIG_RIPPLES + smallIdx;
  ripples[i].set(x, y, clock, strength);
  if (big) bigIdx = (bigIdx + 1) % BIG_RIPPLES; else smallIdx = (smallIdx + 1) % SMALL_RIPPLES;
}

/** The ripple's leading crest at a world point, as the shader draws it. */
function rippleFront(r, sx, sy) {
  const age = clock - r.z;
  if (r.w <= 0 || age < 0 || age > 4) return null;
  const dx = sx - r.x, dy = sy - r.y, dist = Math.hypot(dx, dy) || 1;
  const x = dist - WAVE_SPEED * age, w = 10 + age * 16;
  if (Math.abs(x) > w * 1.6) return null;
  return { e: Math.exp(-(x * x) / (w * w)) * r.w * Math.exp(-age * 0.9), nx: dx / dist, ny: dy / dist };
}

function splash(x, y, n, power) {      // world coords at the surface
  for (let i = 0; i < n && drops.length < 80; i++) {
    const mesh = new THREE.Mesh(BALL, SPLASH_MAT);
    mesh.scale.setScalar(Math.max(view.cw * rand(0.35, 0.6), 3));
    const a = rand(0, Math.PI * 2), sp = rand(40, 170) * power;
    drops.push({ mesh, x, y, z: 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: rand(160, 320) * power, ripple: Math.random() < 0.35 });
    surfaceScene.add(mesh);
  }
}

/* ---------------- fish ---------------- */
const MAX_FISH = 64;
function addFish(sp, near, forceType) {
  const geo = GEO[sp.geo];
  const type = forceType ?? (sp.types ? pick(sp.types) : sp.type);
  const L = view.base * sp.size * rand(0.78, 1.1);
  const mat = new THREE.ShaderMaterial({
    vertexShader: FISH_VERT, fragmentShader: FISH_FRAG, side: THREE.DoubleSide,
    uniforms: {
      uLight: { value: LIGHT }, uType: { value: type }, uSeed: { value: Math.random() * 10 }, uMaxDepth: { value: MAX_DEPTH },
      uPhase: { value: 0 }, uAmp: { value: 0.03 }, uFlap: { value: 0 }, uTurn: { value: 0 }, uFold: { value: 0 },
      uFlare: { value: 0 }, uLong: { value: sp.long }, uRoll: { value: 0 },
      uSpine: { value: [] }, uSeg: { value: 1 }, uL: { value: L },
    },
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  const scene = new THREE.Scene();
  scene.add(mesh);
  const z = near ? near.z : -rand(40, MAX_DEPTH);
  const name = sp.types ? `${sp.name} (${PATTERN_NAMES[type]})` : sp.name;
  const f = {
    sp, mesh, mat, scene, L, z, id: fish.length + Math.random(), zTarget: z, name, cm: Math.round(sp.cm * L / (view.base * sp.size)),
    x: near ? near.x + rand(-1, 1) * L : rand(-0.8, 0.8) * halfW(z),
    y: near ? near.y + rand(-1, 1) * L : rand(-0.8, 0.8) * halfH(z),
    heading: near ? near.heading + rand(-0.3, 0.3) : rand(0, Math.PI * 2),
    cruise: L * sp.cruise * rand(0.8, 1.2), speed: L * sp.cruise,
    turn: 0, turnS: 0, phase: rand(0, 6), flap: rand(0, 6), amp: 0.03, roll: 0, elev: 0, flare: 0,
    wf: [rand(0.13, 0.3), rand(0.05, 0.12)], wp: [rand(0, 6), rand(0, 6)],
    zs: z, thrust: 0.5, thrustTarget: 0.6, fullT: 0, react: rand(0.5, 2.2), startleT: 0, fleeDir: 0, wallSide: 0, duck: 0,
    beatT: rand(0, 1.5), hoverT: 0, wakeT: 0, mode: "cruise", bd: Infinity, target: null,
  };
  initChain(f);
  fish.push(f);
  $("count").textContent = fish.length;
  return f;
}

function addSpecies(sp) {
  if (fish.length >= MAX_FISH) return;
  if (sp.school) {
    const lead = addFish(sp);
    for (let i = 1; i < sp.school && fish.length < MAX_FISH; i++) addFish(sp, lead);
  } else addFish(sp);
}

/* ---------------- pads ---------------- */
function placePads() {
  for (const p of pads) surfaceScene.remove(p.group);
  pads.length = 0;
  const n = clamp(Math.round((view.WX * view.WY) / 330000), 3, 14);
  const m = Math.min(view.W, view.H);
  for (let tries = 0; pads.length < n && tries < 400; tries++) {
    const R = m * rand(0.055, 0.085);
    const x = rand(-0.5, 0.5) * view.WX * 0.94 - 40, y = rand(-0.5, 0.5) * view.WY * 0.94;
    if (y > view.WY / 2 - R - 90) continue;
    if (Math.hypot(x / view.W, y / view.H) < 0.22) continue;
    if (projects.some((p) => Math.hypot(p.hx - x, p.hy - y) < p.r * 2.4 + R * 1.2)) continue;
    if (pads.some((p) => Math.hypot(p.x - x, p.y - y) < (p.R + R) * 1.15)) continue;
    const group = new THREE.Group();
    const pad = new THREE.Mesh(PAD_GEO, PAD_MAT); pad.scale.setScalar(R); group.add(pad);
    if (Math.random() < 0.55) {
      const fl = new THREE.Group();
      fl.add(new THREE.Mesh(PETAL_OUT, PETAL_MAT), new THREE.Mesh(PETAL_IN, PETAL_MAT), new THREE.Mesh(STAMEN, STAMEN_MAT));
      fl.children[2].position.z = 0.15;
      fl.scale.setScalar(R * 0.42); fl.position.set(R * 0.25, -R * 0.2, R * 0.06);
      group.add(fl);
    }
    group.position.set(x, y, 4);
    group.rotation.z = rand(0, Math.PI * 2);
    surfaceScene.add(group);
    pads.push({ group, x, y, R, seed: rand(0, 9), wob: 0, spin: rand(-1, 1) * 0.02 });
  }
}

/* ---------------- food ---------------- */
function dropFood(sx, sy) {
  const [wx, wy] = toWorld(sx, sy);
  const size = Math.max(view.cw * 0.75, 5);
  for (let i = 0; i < 9 && food.length < 60; i++) {
    const mesh = new THREE.Mesh(BALL, FOOD_MAT);
    mesh.scale.setScalar(size * rand(0.8, 1.15));
    const a = rand(0, Math.PI * 2), v = rand(15, 45);
    const p = { mesh, x: wx + rand(-10, 10), y: wy + rand(-10, 10), z: 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v, born: clock, seed: rand(0, 9) };
    mesh.position.set(p.x, p.y, p.z);
    surfaceScene.add(mesh);
    food.push(p);
  }
  ripple(wx, wy, 1.0, true);
  splash(wx, wy, 14, 1);
  // Shy fish dart away from the splash; koi know it means food.
  for (const f of fish) if (f.sp.shy && Math.hypot(f.x - wx, f.y - wy) < f.L * 1.6 + 60 && Math.random() < f.sp.shy) startle(f, Math.atan2(f.y - wy, f.x - wx));
}

function removeFood(i) { surfaceScene.remove(food[i].mesh); food.splice(i, 1); }

function updateFood(dt) {
  for (let i = food.length - 1; i >= 0; i--) {
    const p = food[i], age = clock - p.born;
    // Surface current, a little different from place to place.
    const fx = DRIFT.x + Math.sin(p.y * 0.004 + clock * 0.13 + p.seed * 0.3) * 2.5;
    const fy = DRIFT.y + Math.cos(p.x * 0.0035 - clock * 0.11) * 2.5;
    p.vx += (fx - p.vx) * dt * 0.9;
    p.vy += (fy - p.vy) * dt * 0.9;
    // Passing ripples push pellets outward.
    const [sx, sy] = project(p.x, p.y, 0);
    for (const r of ripples) {
      const fr = rippleFront(r, p.x, p.y);
      if (fr) { p.vx += fr.nx * fr.e * 70 * dt; p.vy += fr.ny * fr.e * 70 * dt; }
    }
    // Fish near the surface: the one going for it sucks it in, others shove it aside.
    for (const f of fish) {
      if (f.z < -70) continue;
      const hx = f.J[0].x, hy = f.J[0].y;
      const dx = p.x - hx, dy = p.y - hy, d = Math.hypot(dx, dy) || 1;
      if (f.target === p && d < f.L * 0.3) { p.vx -= dx / d * 140 * dt; p.vy -= dy / d * 140 * dt; continue; }
      const R = f.L * 0.38;
      if (d < R) {
        const push = (1 - d / R) * (f.speed * 0.25 + 8) * dt * 1.5;
        p.vx += (Math.cos(f.heading) * 0.6 + dx / d * 0.6) * push;
        p.vy += (Math.sin(f.heading) * 0.6 + dy / d * 0.6) * push;
      }
    }
    p.vx *= Math.exp(-dt * 0.8); p.vy *= Math.exp(-dt * 0.8);
    p.x += p.vx * dt; p.y += p.vy * dt;
    // Pellets slide around lily pads instead of under them.
    for (const pd of [...pads, ...projects]) {
      const dx = p.x - pd.x, dy = p.y - pd.y, d = Math.hypot(dx, dy) || 1, R = (pd.R ?? pd.r) * 1.02;
      if (d < R) { p.x = pd.x + dx / d * R; p.y = pd.y + dy / d * R; const vn = (p.vx * dx + p.vy * dy) / d; if (vn < 0) { p.vx -= vn * dx / d; p.vy -= vn * dy / d; } }
    }
    p.z = 2 + Math.sin(clock * 2.2 + p.seed) * 1.5;
    if (age > 70) p.z -= (age - 70) * 30;
    p.mesh.position.set(p.x, p.y, p.z);
    p.mesh.rotation.set(clock * 0.7 + p.seed, clock * 0.5, 0);
    if (Math.abs(p.x) > view.WX / 2 + 30 || p.y > shoreY(p.x) - 14 || p.y < -view.WY / 2 - 30) {   // off the edge, or washed ashore
      removeFood(i); lostCount++; $("lost").textContent = lostCount;
    } else if (age > 76) removeFood(i);
  }
}

function updateDrops(dt) {
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.vz -= 950 * dt;
    d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
    if (d.z < 0) {
      if (d.ripple) ripple(d.x, d.y, 0.18);
      surfaceScene.remove(d.mesh); drops.splice(i, 1);
      continue;
    }
    d.mesh.position.set(d.x, d.y, d.z);
  }
}

function updatePads(dt) {
  for (const p of pads) {
    const [sx, sy] = project(p.x, p.y, 0);
    let kick = 0;
    for (const r of ripples) { const fr = rippleFront(r, p.x, p.y); if (fr) kick = Math.max(kick, fr.e); }
    p.wob = Math.max(p.wob * Math.exp(-dt * 1.4), kick);
    p.group.rotation.x = 0.04 * Math.sin(clock * 0.6 + p.seed) + p.wob * 0.18 * Math.sin(clock * 7 + p.seed);
    p.group.rotation.y = 0.04 * Math.sin(clock * 0.5 + p.seed * 2) + p.wob * 0.18 * Math.cos(clock * 6 + p.seed);
    p.group.rotation.z += p.spin * dt;
  }
}

/* ---------------- swimming ---------------- */
const pointer = { x: 0, y: 0, vx: 0, vy: 0, t: 0, lastRipple: 0, inside: false };

/* ---------------- the backbone ----------------
 * Each fish has a chain of NJ joints from snout to tail tip. The head is
 * rigid and turns around a pivot a third of the way back; every joint
 * behind it follows the one in front (so the body traces the path the head
 * swam), straightens a little each frame (body stiffness), and can bend
 * only so far per joint. The vertex shader lays the mesh along this chain
 * and adds the tail-beat wave on top. */
const HEAD_ARC = 0.3, HEAD_RIGID = 0.36;

function layHead(f) {
  const ce = Math.cos(f.elev), hx = Math.cos(f.heading) * ce, hy = Math.sin(f.heading) * ce, hz = Math.sin(f.elev);
  for (let i = 0; i < f.headN; i++) {
    const k = f.L * HEAD_ARC - i * f.seg;
    f.J[i].set(f.x + hx * k, f.y + hy * k, f.z + hz * k);
  }
}

function initChain(f) {
  f.seg = (f.L * 1.5) / (NJ - 1);
  f.headN = Math.floor((f.L * HEAD_RIGID) / f.seg) + 1;
  f.J = Array.from({ length: NJ }, () => new THREE.Vector3());
  layHead(f);
  const hx = Math.cos(f.heading), hy = Math.sin(f.heading);
  for (let i = f.headN; i < NJ; i++) f.J[i].set(f.J[i - 1].x - hx * f.seg, f.J[i - 1].y - hy * f.seg, f.J[i - 1].z);
  const u = f.mat.uniforms;
  u.uSpine.value = f.J; u.uSeg.value = f.seg; u.uL.value = f.L;
}

function followChain(f, dt) {
  layHead(f);
  const J = f.J, seg = f.seg;
  const k = 1 - Math.exp(-dt * f.sp.stiff), cb = Math.cos(f.sp.bend), sb = Math.sin(f.sp.bend);
  for (let i = f.headN; i < NJ; i++) {
    const a = J[i - 1], b = J[i - 2];
    let px = a.x - b.x, py = a.y - b.y, pz = a.z - b.z, l = Math.hypot(px, py, pz) || 1;
    px /= l; py /= l; pz /= l;
    let dx = J[i].x - a.x, dy = J[i].y - a.y, dz = J[i].z - a.z;
    l = Math.hypot(dx, dy, dz) || 1; dx /= l; dy /= l; dz /= l;
    dx += (px - dx) * k; dy += (py - dy) * k; dz += (pz - dz) * k;
    l = Math.hypot(dx, dy, dz) || 1; dx /= l; dy /= l; dz /= l;
    const dot = dx * px + dy * py + dz * pz;
    if (dot < cb) {
      let ox = dx - px * dot, oy = dy - py * dot, oz = dz - pz * dot;
      l = Math.hypot(ox, oy, oz) || 1; ox /= l; oy /= l; oz /= l;
      dx = px * cb + ox * sb; dy = py * cb + oy * sb; dz = pz * cb + oz * sb;
    }
    J[i].set(a.x + dx * seg, a.y + dy * seg, a.z + dz * seg);
  }
}

/** A fast-start escape: the head whips round, the body snaps into a C, then the tail drives it away. */
function startle(f, away) {
  if (f.startleT > 0) return;
  f.startleT = rand(0.5, 0.9);
  f.fleeDir = away + rand(-0.4, 0.4);
  f.amp = Math.max(f.amp, 0.1);
  f.zTarget = Math.min(f.zTarget, -120);
  f.hoverT = 0;
}

/* ---------------- steering ---------------- */
function steer(f, dt) {
  const sp = f.sp, L = f.L, h = f.heading, ch = Math.cos(h), sh = Math.sin(h);
  const bx = halfW(f.z), by = halfH(f.z);
  // Wandering from slow overlapping sine waves: smooth, never jittery.
  const wander = 0.65 * Math.sin(clock * f.wf[0] + f.wp[0]) + 0.35 * Math.sin(clock * f.wf[1] + f.wp[1]);
  let ax = Math.cos(h + wander * 0.8), ay = Math.sin(h + wander * 0.8);
  let want = f.cruise, mode = "cruise";

  // Edges: look ahead along the heading and turn for open water, always on
  // the same side until clear (no dithering when meeting a wall head-on).
  const look = Math.max(L * 1.2, f.speed * 1.6), m = Math.max(L * 0.5, 50);
  const lx = f.x + ch * look, ly = f.y + sh * look;
  let ox = 0, oy = 0;
  const north = Math.min(by, shoreY(lx) - 40 - L * 0.15);   // the shore, with room for the whole body
  if (lx > bx - m) ox -= lx - bx + m;
  if (lx < -bx + m) ox += -bx + m - lx;
  if (ly > north - m) oy -= ly - north + m;
  if (ly < -by + m) oy += -by + m - ly;
  if (ox || oy) {
    const ol = Math.hypot(ox, oy), w = Math.min(3, ol / (L * 0.6));
    ax += (ox / ol) * w; ay += (oy / ol) * w;
    if (!f.wallSide) f.wallSide = Math.sign(wrap(Math.atan2(oy, ox) - h)) || 1;
  } else f.wallSide = 0;

  // Other fish: keep apart, duck under, veer from anyone dead ahead, school with your own kind.
  f.duck = 0;
  const mid = f.J[9];
  let alx = 0, aly = 0, scx = 0, scy = 0, mates = 0;
  for (const g of fish) {
    if (g === f) continue;
    const gm = g.J[9], dx = mid.x - gm.x, dy = mid.y - gm.y, d = Math.hypot(dx, dy), dz = Math.abs(f.z - g.z);
    const min = (f.L + g.L) * 0.42;
    if (d > 0 && d < min && dz < 90) {
      ax += (dx / d) * (min - d) / min * 2; ay += (dy / d) * (min - d) / min * 2;
      const gap = (f.L + g.L) * 0.14;
      if (f.z <= g.z && g.z - f.z < gap && (f.z < g.z || f.id < g.id)) f.duck = Math.max(f.duck, gap - (g.z - f.z));
    }
    const fwd = -dx * ch - dy * sh, lat = dx * sh - dy * ch;
    if (fwd > 0 && fwd < L * 1.3 && Math.abs(lat) < (f.L + g.L) * 0.25 && dz < 60) {
      const s = lat > 0 ? -1 : 1, wv = (1 - fwd / (L * 1.3)) * 1.4;
      ax += -sh * s * wv; ay += ch * s * wv;
    }
    if (sp.school && g.sp === sp && d < L * 4) { alx += Math.cos(g.heading); aly += Math.sin(g.heading); scx += gm.x; scy += gm.y; mates++; }
  }
  if (mates) {
    ax += (alx / mates) * 0.9; ay += (aly / mates) * 0.9;
    const dx = scx / mates - mid.x, dy = scy / mates - mid.y, d = Math.hypot(dx, dy) || 1;
    ax += (dx / d) * 0.5; ay += (dy / d) * 0.5;
    const lead = fish.find((g) => g.sp === sp);
    if (lead && lead !== f) f.zTarget += (lead.zTarget - f.zTarget) * dt;
  }

  // Escapes override everything else.
  const [psx, psy] = project(f.x, f.y, f.z);
  const pd = Math.hypot(psx - pointer.x, psy - pointer.y) || 1;
  if (pointer.inside && Math.hypot(pointer.vx, pointer.vy) > 1100 && pd < 190) startle(f, Math.atan2(-(psy - pointer.y), psx - pointer.x));
  if (f.startleT > 0) {
    f.startleT -= dt;
    f.mode = "flee"; f.target = null; f.bd = Infinity;
    return { desired: f.fleeDir, want: L * 1.9, mode: "flee" };
  }

  // Food: notice it after a moment, aim where it's drifting, slow down to
  // line up, then lunge for the last stretch and tilt up to take it.
  let best = null, bd = 420 * Math.sqrt(sp.chase);
  if (f.fullT > 0) f.fullT -= dt;
  const snout = f.J[0];
  for (const p of food) {
    if (p.z < -40 || f.fullT > 0 || clock - p.born < f.react) continue;
    const d = Math.hypot(p.x - snout.x, p.y - snout.y);
    if (d < bd) { bd = d; best = p; }
  }
  f.target = best;
  if (best) {
    const tx = best.x + best.vx * 0.4, ty = best.y + best.vy * 0.4;
    const d = Math.hypot(tx - snout.x, ty - snout.y) || 1;
    ax += ((tx - f.x) / d) * 3; ay += ((ty - f.y) / d) * 3;
    mode = "chase";
    want = d < L * 0.45 ? L * sp.chase * 0.75 : L * sp.chase * clamp(d / (L * 1.4), 0.35, 1);
    f.zTarget = bd < L * 2.5 ? -4 : -30;
  } else if (Math.random() < dt * 0.07) f.zTarget = -rand(30, MAX_DEPTH);

  if (!best && openProj && sp.geo !== "orfe") {          // curious koi gather under the open project
    const dx = openProj.x - f.x, dy = openProj.y - f.y, d = Math.hypot(dx, dy) || 1;
    if (d < 700 && d > openProj.r * 2.5) { ax += (dx / d) * 0.9; ay += (dy / d) * 0.9; }
    else if (d <= openProj.r * 2.5) want *= 0.5;
  }
  if (mode === "cruise") {
    if (f.hoverT > 0) { f.hoverT -= dt; want = L * 0.03; mode = "hover"; }
    else if (Math.random() < dt * sp.hover) f.hoverT = rand(2, 5);
  }
  f.mode = mode;
  f.bd = bd;
  return { desired: Math.atan2(ay, ax), want, mode };
}

/* ---------------- swimming ---------------- */
function swim(f, dt) {
  const sp = f.sp, L = f.L;
  const { desired, want, mode } = steer(f, dt);
  const urgent = mode === "chase" || mode === "flee";

  // Burst and glide: a few tail beats, then coast with the body nearly straight.
  if (urgent) f.thrustTarget = 1;
  else if (mode === "hover") f.thrustTarget = 0;
  else {
    f.beatT -= dt;
    if (f.beatT <= 0) {
      if (f.thrustTarget > 0.05) { f.thrustTarget = 0; f.beatT = rand(0.8, 2.6) * sp.glide; }
      else { f.thrustTarget = rand(0.45, 0.85); f.beatT = rand(0.7, 1.6); }
    }
  }
  f.thrust += (f.thrustTarget - f.thrust) * Math.min(1, dt * (mode === "flee" ? 12 : 3));

  // Speed: thrust accelerates, water drag slows a coasting fish gradually,
  // pectorals flare to brake when it needs to stop.
  const goal = mode === "hover" ? want : want * (0.5 + 0.8 * f.thrust);
  const braking = f.speed > goal * 1.2 && mode !== "cruise";
  const rate = mode === "flee" ? 5 : f.thrust > 0.1 ? 1.5 : 0.4;
  f.speed += (goal - f.speed) * Math.min(1, dt * rate * (braking ? 2.5 : 1));
  f.flare += ((braking || mode === "hover" ? 1 : 0) - f.flare) * Math.min(1, dt * 4);

  // Turning: the head turns around its pivot and the body follows its path.
  let diff = wrap(desired - f.heading);
  if (f.wallSide && Math.abs(diff) > 2.3) diff = f.wallSide * Math.abs(diff);
  const maxTurn = mode === "flee" ? 7 : sp.turn * (mode === "chase" ? 2 : mode === "hover" ? 0.5 : 1);
  f.turn += (clamp(diff * 2, -maxTurn, maxTurn) - f.turn) * Math.min(1, dt * (mode === "flee" ? 12 : 3));
  f.turnS += (f.turn - f.turnS) * Math.min(1, dt * 2);
  f.heading = wrap(f.heading + f.turn * dt);
  f.x += Math.cos(f.heading) * f.speed * dt;
  f.y += Math.sin(f.heading) * f.speed * dt;

  // Depth: stay under the surface; the head tilts the way the fish is going.
  const zMax = -L * 0.16;
  f.zTarget = Math.min(f.zTarget, zMax);
  const vz = clamp((f.zTarget - f.z) * 0.6, -50, 50) - f.duck * 3;
  f.z = clamp(f.z + vz * dt, -MAX_DEPTH - 60, zMax);
  let elevT = Math.atan2(vz, Math.max(f.speed, L * 0.25)) * 0.9;
  if (mode === "chase" && f.bd < L * 0.9) elevT = 0.22;
  f.elev += (clamp(elevT, -0.45, 0.45) - f.elev) * Math.min(1, dt * 2.5);
  f.roll += (clamp(-f.turn * 0.22, -0.4, 0.4) - f.roll) * Math.min(1, dt * 3);

  // Tail: beat rate and size follow thrust and speed; a turn adds a sweep.
  const rel = f.speed / L;

        tLook = b.aDir[i] * 0.9; b.hop[i] = 0;
      } else {                        // shake the wings out
        wingFlick = Math.sin(Math.min(1, b.act[i] / 0.35) * Math.PI);
      }
      // Stay off rocks, in the garden, and apart.
      for (const g of garden.built) { const dx = b.x[i] - g.cx, dy = b.y[i] - g.cy, d = Math.hypot(dx, dy) || 1, m = g.R + BS * 0.9; if (d < m) { b.x[i] = g.cx + dx / d * m; b.y[i] = g.cy + dy / d * m; } }
      if (b.y[i] - shoreY(b.x[i]) < 60 || Math.abs(b.x[i]) > GW * 0.45) b.face[i] += dt * 4;
      b.lx[i] = b.x[i]; b.ly[i] = b.y[i];
      b.peck[i] += (tPeck - b.peck[i]) * Math.min(1, dt * 18);
      b.look[i] += (tLook - b.look[i]) * Math.min(1, dt * 9);
      b.tuck[i] += (1 - wingFlick * 0.7 - b.tuck[i]) * Math.min(1, dt * 10);
      b.amp[i] += (wingFlick * 0.55 - b.amp[i]) * Math.min(1, dt * 14);
      b.ph[i] += dt * 30 * wingFlick;
      b.z[i] = b.hop[i];
      b.bank[i] *= Math.exp(-dt * 8); b.bend[i] *= Math.exp(-dt * 8);
      continue;
    }

    /* ---- in the air: flying, landing or taking off ---- */
    let fx = 0, fy = 0;
    if (mode === LAND) {
      // Glide in, then flare: slow right down with big beats just before touching down.
      const dx = b.lx[i] - x, dy = b.ly[i] - y, d = Math.hypot(dx, dy) || 1;
      const want = Math.min(330, 30 + d * 1.1);
      fx += (dx / d * want - b.vx[i]) * 3.2; fy += (dy / d * want - b.vy[i]) * 3.2;
      b.z[i] += (Math.min(230, d * 0.55) - b.z[i]) * Math.min(1, dt * 3);
      if (near(i) || (pw && Math.hypot(b.lx[i] - pw[0], b.ly[i] - pw[1]) < PR)) { b.mode[i] = TAKEOFF; b.tm[i] = 0.8; }
      if (d < 6 && b.z[i] < 8) {
        b.mode[i] = GROUND; b.x[i] = b.lx[i]; b.y[i] = b.ly[i]; b.vx[i] = b.vy[i] = 0; b.z[i] = 0;
        b.gt[i] = rand(5, 14); b.aT[i] = rand(0.2, 0.6); b.aK[i] = 0; b.startle[i] = 0;
        continue;
      }
    } else {
      let ax = 0, ay = 0, cx = 0, cy = 0, n = 0, sx = 0, sy = 0;
      const gx = gxOf(x), gy = gyOf(y);
      for (let yy = Math.max(0, gy - 1); yy <= Math.min(GHc - 1, gy + 1); yy++) for (let xx = Math.max(0, gx - 1); xx <= Math.min(GWc - 1, gx + 1); xx++) {
        for (let j = b.head[xx + yy * GWc]; j !== -1; j = b.next[j]) {
          if (j === i) continue;
          const dx = b.x[j] - x, dy = b.y[j] - y, d2 = dx * dx + dy * dy;
          if (d2 > R2) continue;
          ax += b.vx[j]; ay += b.vy[j]; cx += dx; cy += dy; n++;
          if (d2 < S * S) { const d = Math.sqrt(d2) || 1; sx -= (dx / d) * (S - d); sy -= (dy / d) * (S - d); }
        }
      }
      if (n) { fx += (ax / n - b.vx[i]) * 1.4 + (cx / n) * 1.1; fy += (ay / n - b.vy[i]) * 1.4 + (cy / n) * 1.1; }
      fx += sx * 60 / K; fy += sy * 60 / K;
      const dxa = axp - x, dya = ayp - y, da = Math.hypot(dxa, dya) || 1;
      fx += ((dxa / da) * 70 - (dya / da) * 40) * 2; fy += ((dya / da) * 70 + (dxa / da) * 40) * 2;
      if (Math.abs(x) > GW * 0.5) fx -= Math.sign(x) * 520;
      if (Math.abs(y - GCY) > GH * 0.3) fy -= Math.sign(y - GCY) * 700;
      if (mode === TAKEOFF) {
        b.z[i] += (240 - b.z[i]) * Math.min(1, dt * 1.6);
        b.tm[i] -= dt;
        if (b.tm[i] <= 0 && b.z[i] > 150) b.mode[i] = FLY;
      } else {
        b.z[i] += ((210 + 90 * Math.sin(t * 0.3 + x * 0.004)) - b.z[i]) * dt * 0.5;
        // Now and then a bird peels off to feed on the sand.
        if (!near(i) && grounded < N * 0.4 && Math.random() < dt * 0.08) {
          const spot = landingSpot(b, i, pw, PR);
          if (spot) { b.mode[i] = LAND; b.lx[i] = spot[0]; b.ly[i] = spot[1]; grounded++; }
        }
      }
    }
    if (pw) {
      const dx = x - pw[0], dy = y - pw[1], d = Math.hypot(dx, dy);
      if (d < PR && d > 0) { const k = (1 - d / PR) * 2800; fx += (dx / d) * k; fy += (dy / d) * k; }
    }
    let vx = b.vx[i] + fx * dt, vy = b.vy[i] + fy * dt;
    // Effort: how hard the bird is pushing decides flap or glide.
    const along = (fx * b.vx[i] + fy * b.vy[i]) / (Math.hypot(b.vx[i], b.vy[i]) || 1);
    b.tm[i] -= mode === FLY ? dt : 0;
    if (mode === FLY && (b.tm[i] <= 0 || (b.gl[i] && along > 260))) {
      if (b.gl[i] || along > 120) { b.gl[i] = 0; b.tm[i] = rand(0.5, 1.3); }      // a burst of beats
      else { b.gl[i] = 1; b.tm[i] = rand(0.35, 0.9); }                           // then a glide
    }
    const v = Math.hypot(vx, vy) || 1;
    const lo = mode === LAND ? 20 : mode === TAKEOFF ? 150 : 220;
    const vc = clamp(v, lo, 480);
    vx *= vc / v; vy *= vc / v;
    b.vx[i] = vx; b.vy[i] = vy;
    b.x[i] = x + vx * dt; b.y[i] = y + vy * dt;
  }

  // Pose and wingbeat, then the instance matrices.
  const arr = garden.mesh.instanceMatrix.array, sc = BS, an = garden.anim.array, po = garden.pose.array;
  for (let i = 0; i < N; i++) {
    const mode = b.mode[i];
    if (mode !== GROUND) {
      // Face along the flight path, but turn with some weight, not instantly.
      const want = Math.atan2(b.vy[i], b.vx[i]);
      let dh = want - b.face[i]; dh -= Math.round(dh / 6.2832) * 6.2832;
      const step = clamp(dh, -dt * 7, dt * 7);
      b.face[i] += step;
      const turn = step / Math.max(dt, 1e-3);
      b.gust[i] += (rand(-1, 1) * 0.5 - b.gust[i]) * Math.min(1, dt * 2.5);
      b.bank[i] += (clamp(-turn * 0.35, -0.8, 0.8) + b.gust[i] * 0.12 - b.bank[i]) * Math.min(1, dt * 5);
      b.bend[i] += (clamp(turn * 0.2, -0.55, 0.55) - b.bend[i]) * Math.min(1, dt * 8);
      // The head leads the turn and holds steady against the roll.
      b.look[i] += (clamp(turn * 0.08, -0.15, 0.15) - b.look[i]) * Math.min(1, dt * 10);
      b.peck[i] *= Math.exp(-dt * 10);
      b.tuck[i] += (0 - b.tuck[i]) * Math.min(1, dt * (mode === TAKEOFF ? 14 : 6));
      const flee = !!near(i);
      let tAmp, rate;
      if (mode === TAKEOFF) { tAmp = 1.15; rate = 24; }
      else if (mode === LAND) {
        const d = Math.hypot(b.lx[i] - b.x[i], b.ly[i] - b.y[i]);
        const flare = d < BS * 3.5;
        tAmp = flare ? 1.0 : 0.05; rate = flare ? 21 : 6;
      } else {
        const flap = !b.gl[i] || flee;
        tAmp = flee ? 1.05 : flap ? 0.85 : 0.06; rate = flee ? 23 : flap ? 16 : 16 * b.amp[i];
      }
      b.amp[i] += (tAmp - b.amp[i]) * Math.min(1, dt * (tAmp > b.amp[i] ? 7 : 3));
      b.ph[i] += dt * b.rate[i] * rate;
    }
    const a = b.face[i], c = Math.cos(a) * sc, sn = Math.sin(a) * sc, o = i * 16;
    an[i * 4] = b.ph[i]; an[i * 4 + 1] = b.amp[i]; an[i * 4 + 2] = b.bank[i]; an[i * 4 + 3] = b.bend[i];
    po[i * 3] = b.tuck[i]; po[i * 3 + 1] = b.peck[i]; po[i * 3 + 2] = b.look[i];
    arr[o] = c; arr[o + 1] = sn; arr[o + 2] = 0; arr[o + 3] = 0;
    arr[o + 4] = -sn; arr[o + 5] = c; arr[o + 6] = 0; arr[o + 7] = 0;
    arr[o + 8] = 0; arr[o + 9] = 0; arr[o + 10] = sc; arr[o + 11] = 0;
    arr[o + 12] = b.x[i]; arr[o + 13] = b.y[i]; arr[o + 14] = b.z[i]; arr[o + 15] = 1;
  }
  garden.mesh.instanceMatrix.needsUpdate = true;
  garden.anim.needsUpdate = true;
  garden.pose.needsUpdate = true;
}

function layoutGarden() {
  const u = cellMat.uniforms;
  u.uSpacing.value = garden.spacing;
  u.uShadowRock.value.set(-7 / view.cw, 6 / view.ch);
  u.uShadowBird.value.set(-60 / view.cw, 46 / view.ch);
}

function initGarden() {
  garden.spacing = Math.max(16, Math.round(view.ch * 1.4));
  if (!garden.ready) { initBirds(); garden.ready = true; }
  buildGardenScene();
  buildSand();
  layoutGarden();
}

function stepGarden(dt) {
  stepBirds(dt);
  // Smoothing sweeps the fresh pattern back across from west to east.
  if (garden.restoreX >= 0) {
    const to = Math.min(garden.hw, garden.restoreX + Math.ceil((garden.hw * dt) / 1.4));
    for (let iy = 0; iy < garden.hh; iy++) for (let ix = garden.restoreX; ix < to; ix++) { const i = (iy * garden.hw + ix) * 2; garden.h[i] = garden.base[i]; garden.h[i + 1] = garden.base[i + 1]; }
    garden.restoreX = to >= garden.hw ? -1 : to;
    garden.dirty = true;
  }
  if (garden.dirty) { garden.tex.needsUpdate = true; garden.dirty = false; }
}

canvas.addEventListener("pointerdown", (e) => {
  if (!overSandAt(e.clientX, e.clientY)) return;
  garden.last = toWorld(e.clientX, e.clientY);
  garden.rakeId = e.pointerId;
  if (e.pointerType === "touch") { garden.touchStart = { x: e.clientX, y: e.clientY, id: e.pointerId }; return; }
  garden.raking = true;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (garden.rakeId !== undefined && e.pointerId !== garden.rakeId && e.pointerType === "touch") return;
  const ts = garden.touchStart;
  if (ts && ts.id === e.pointerId && touches.size === 1 && Math.hypot(e.clientX - ts.x, e.clientY - ts.y) > 10) { garden.raking = true; garden.touchStart = null; }
  const cur = toWorld(e.clientX, e.clientY);
  if (!garden.last) { garden.last = cur; return; }
  const dx = cur[0] - garden.last[0], dy = garden.last[1] - cur[1], d = Math.hypot(dx, dy);   // dy in screen orientation
  if (d > 2) {
    garden.rakeDir = [garden.rakeDir[0] * 0.7 + (dx / d) * 0.3, garden.rakeDir[1] * 0.7 + (dy / d) * 0.3];
    const l = Math.hypot(...garden.rakeDir) || 1; garden.rakeDir = [garden.rakeDir[0] / l, garden.rakeDir[1] / l];
    if (garden.raking && overSandAt(e.clientX, e.clientY)) rakeSegment(garden.last[0], garden.last[1], cur[0], cur[1]);
    garden.last = cur;
  }
});
const endRake = () => { garden.raking = false; garden.touchStart = null; };
canvas.addEventListener("pointerup", endRake);
canvas.addEventListener("pointercancel", endRake);

/** The page's colours and controls follow where the view is: water or sand. */
function applyTheme(v) {
  if (v === currentView) return;
  currentView = v;
  document.documentElement.dataset.view = v;
  document.querySelectorAll("#views button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.view === v)));
  if (v === "garden") aboutDecodeT = clock;
  tag.hidden = true;
}
function updateTheme() {
  const hh = view.H / 2 / view.zoom;
  const sand = clamp((view.panY + hh - shoreY(view.panX)) / (2 * hh), 0, 1);     // share of the screen that is garden
  if (sand > 0.45) applyTheme("garden"); else if (sand < 0.35) applyTheme("pond");
}
const goTo = (v) => (v === "garden" ? flyTo(0, gardenCY()) : flyTo(0, 0));
document.querySelectorAll("#views button").forEach((b) => b.addEventListener("click", () => {
  if (location.hash === "#" + b.dataset.view) goTo(b.dataset.view); else location.hash = b.dataset.view;
}));
addEventListener("hashchange", () => { if (location.hash === "#garden" || location.hash === "#pond") goTo(location.hash.slice(1)); });

/* ---------------- loop ---------------- */
function populate() {
  const byId = (id) => SPECIES.find((s) => s.id === id);
  // One of every kind (the orfe come as a school), in a random order.
  for (const sp of SPECIES.slice().sort(() => Math.random() - 0.5)) addSpecies(sp);
  // A butterfly koi in each of its patterns.
  const bf = byId("butterfly");
  const seen = new Set(fish.filter((f) => f.sp === bf).map((f) => f.mat.uniforms.uType.value));
  for (const t of bf.types) if (!seen.has(t)) addFish(bf, null, t);
  // Then plenty more koi, a few more goldfish and a second school of orfe.
  const more = clamp(Math.round((view.WX * view.WY) / 220000), 10, 20);
  for (let i = 0; i < more; i++) addSpecies(byId(pick(KOI_IDS)));
  for (const id of ["comet", "shubunkin", "comet", "orfe"]) addSpecies(byId(id));
}

async function start() {
  try { await Promise.race([document.fonts.load(`600 16px "JetBrains Mono"`), new Promise((r) => setTimeout(r, 1500))]); } catch {}
  resize();
  populate();
  introT0 = performance.now();
  if (location.hash === "#garden") { flyTo(0, gardenCY()); view.panX = cam.target.x; view.panY = cam.target.y; cam.target = null; updateTheme(); }
  const fromHash = projects.find((q) => q.id === location.hash.slice(1));
  if (fromHash) { openProject(fromHash); if (cam.target) { view.panX = cam.target.x; view.panY = cam.target.y; cam.target = null; } }
  let last = performance.now(), frameN = 0;
  const t0 = last;
  window.pondStarted = true;
  let failed = 0;
  const frame = (now) => {
    requestAnimationFrame(frame);
    try { render(now); } catch (e) { console.error(e); if (++failed === 1) window.pondFail?.("The pond hit an error: " + e.message); }
  };
  const render = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000) * (reduce ? 0.5 : 1);
    last = now; clock += dt;
    step(dt);
    stepGarden(dt);
    updateCamera(dt);
    updateHover();
    if (hovered) tag.hidden = true; else updateTag();
    drawLabels();
    updateGlows();
    if ((frameN = (frameN + 1) % 2) === 0) drawMinimap();
    cellMat.uniforms.uTime.value = clock;
    if (!reduce) cellMat.uniforms.uIntro.value = now - introT0;
    renderer.setRenderTarget(shadeT);
    renderer.clear();
    // Fish one at a time, deepest first, clearing depth in between: a fish
    // higher in the water always covers a lower one completely, even when
    // their bodies would cut into each other.
    for (const f of fish.slice().sort((a, b) => a.zs - b.zs || a.id - b.id)) {
      renderer.render(f.scene, camera);
      renderer.clearDepth();
    }
    // The surface (pads, food, splashes) always covers the fish.
    renderer.render(surfaceScene, camera);
    renderer.clearDepth();                         // the garden, and the birds over everything
    renderer.render(gScene, camera);
    renderer.setRenderTarget(cellT); renderer.render(cellScene, quadCam);
    renderer.setRenderTarget(null); renderer.render(screenScene, quadCam);
  };
  requestAnimationFrame(frame);
}
start();
</script>
